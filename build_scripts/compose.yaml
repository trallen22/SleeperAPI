services:
  api:
    build:
      context: ..
      dockerfile: build_scripts/backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../sleeper_fantasy.db:/backend/data/sleeper_fantasy.db
  frontend:
    build:
      context: ..
      dockerfile: build_scripts/frontend/Dockerfile
    ports:
      - "5173:5173"