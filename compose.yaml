services:
  api:
    build:
      context: .
      dockerfile: ./build_scripts/backend/Dockerfile
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    ports:
      - "8000:8000"
    volumes:
      - ./sleeper_fantasy.db:/backend/data/sleeper_fantasy.db
  frontend:
    build:
      context: .
      dockerfile: ./build_scripts/frontend/Dockerfile
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    ports:
      - "5173:5173"