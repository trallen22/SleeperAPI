services:
  api:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data/sleeper_fantasy.db:/backend/data/sleeper_fantasy.db
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    ports:
      - "5173:5173"